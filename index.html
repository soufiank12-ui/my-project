<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مرحبا سفيان</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: system-ui, sans-serif;
      background-color: #f0f4f8;
      transition: background-color 0.4s ease;
    }
    h1 {
      font-size: 2.5rem;
      color: #222;
      margin-bottom: 1.5rem;
    }
    button {
      font-size: 1.1rem;
      padding: 0.8rem 1.8rem;
      border: none;
      border-radius: 8px;
      background: #222;
      color: #fff;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <h1>مرحبا بيك، سفيان! 👋</h1>
  <button id="colorBtn">بدّل اللون</button>

  <script>
    const colors = ["#f0f4f8", "#ffe0e0", "#e0ffe4", "#e0ecff", "#fff6d6", "#f1e0ff", "#d6fff8"];
    // نغمة لكل لون (دو، ري، مي، فا، صول، لا، سي)
    const notes = [261.63, 293.66, 329.63, 349.23, 392.0, 440.0, 493.88];
    let current = 0;
    let audioCtx = null;

    function playNote(freq) {
      try {
        audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        const now = audioCtx.currentTime;
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.3, now + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
        osc.connect(gain).connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.4);
      } catch (e) {
        // إلا المتصفح ما خدمش الصوت، اللون كيتبدل عادي
      }
    }

    document.getElementById("colorBtn").addEventListener("click", () => {
      current = (current + 1) % colors.length;
      document.body.style.backgroundColor = colors[current];
      playNote(notes[current]);
    });
  </script>
</body>
</html>
